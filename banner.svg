<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ce422b" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="800" y2="0" stroke="#000000" stroke-width="2" opacity="0.35" />
      <line x1="0" y1="2" x2="800" y2="2" stroke="#ffffff" stroke-width="0.5" opacity="0.02" />
    </pattern>

    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="260" fill="url(#bg)" />
  <rect width="800" height="260" fill="url(#grid)" />
  <rect width="800" height="260" fill="url(#glow)" />

  <!-- Wing Watermark (Matching avatar) -->
  <g transform="translate(400, 130) scale(1.6)" opacity="0.04" fill="#ffffff">
    <path d="M-10,-20 C-40,-70 -120,-80 -180,-40 C-140,-10 -90,20 -40,30 C-30,10 -20,0 -10,-20 Z" />
    <path d="M10,-20 C40,-70 120,-80 180,-40 C140,-10 90,20 40,30 C30,10 20,0 10,-20 Z" />
    <circle cx="0" cy="-55" r="12" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-45" x2="0" y2="40" stroke="#ffffff" stroke-width="2.5" />
    <line x1="-22" y1="-15" x2="22" y2="-15" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Framing Brackets -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" fill="none" font-family="'JetBrains Mono', monospace" font-size="9" letter-spacing="1.5">
    <path d="M 25 35 L 25 20 L 40 20" />
    <text x="48" y="27" fill="rgba(255,255,255,0.3)" stroke="none">THUND3R.XYZ</text>

    <path d="M 775 35 L 775 20 L 760 20" />
    <text x="695" y="27" fill="rgba(255,255,255,0.3)" stroke="none">SYS//DEV</text>

    <path d="M 25 225 L 25 240 L 40 240" />
    <path d="M 775 225 L 775 240 L 760 240" />
  </g>

  <!-- Center Typography -->
  <g text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', -apple-system, monospace">
    <!-- Red Glitch Offset -->
    <text x="402" y="132" font-size="56" font-weight="900" fill="#ce422b" opacity="0.35" letter-spacing="10">
      thund3r
    </text>

    <!-- Main Typography -->
    <text x="400" y="130" font-size="56" font-weight="900" fill="#f8fafc" letter-spacing="10">
      thund3r
    </text>

    <!-- Monospace Subtitle -->
    <text x="400" y="175" font-size="11" font-weight="600" fill="rgba(255, 255, 255, 0.45)" letter-spacing="3">
      RUST • TAURI • TYPESCRIPT • SYSTEMS
    </text>
  </g>

  <!-- CRT Scanlines -->
  <rect width="800" height="260" fill="url(#scanlines)" pointer-events="none" />
</svg>
