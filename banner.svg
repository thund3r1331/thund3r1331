<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ce422b" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="1200" y2="0" stroke="#000000" stroke-width="2" opacity="0.35" />
      <line x1="0" y1="2" x2="1200" y2="2" stroke="#ffffff" stroke-width="0.5" opacity="0.02" />
    </pattern>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="200" fill="url(#bg)" />
  <rect width="1200" height="200" fill="url(#grid)" />
  <rect width="1200" height="200" fill="url(#centerGlow)" />

  <!-- Wing Watermark (Matching avatar) -->
  <g transform="translate(600, 100) scale(1.6)" opacity="0.035" fill="#ffffff">
    <path d="M-10,-20 C-40,-70 -120,-80 -180,-40 C-140,-10 -90,20 -40,30 C-30,10 -20,0 -10,-20 Z" />
    <path d="M10,-20 C40,-70 120,-80 180,-40 C140,-10 90,20 40,30 C30,10 20,0 10,-20 Z" />
    <circle cx="0" cy="-55" r="12" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-45" x2="0" y2="40" stroke="#ffffff" stroke-width="2.5" />
    <line x1="-22" y1="-15" x2="22" y2="-15" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Minimal Brackets -->
  <g stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" fill="none" font-family="'JetBrains Mono', monospace" font-size="10" letter-spacing="2">
    <path d="M 30 35 L 30 20 L 45 20" />
    <text x="55" y="27" fill="rgba(255,255,255,0.3)" stroke="none">THUND3R.XYZ</text>

    <path d="M 1170 35 L 1170 20 L 1155 20" />
    <text x="1070" y="27" fill="rgba(255,255,255,0.3)" stroke="none">SYS//DEV</text>

    <path d="M 30 165 L 30 180 L 45 180" />
    <path d="M 1170 165 L 1170 180 L 1155 180" />
  </g>

  <!-- Center Typography -->
  <g text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', -apple-system, monospace">
    <!-- Red Glitch Offset -->
    <text x="602" y="107" font-size="54" font-weight="900" fill="#ce422b" opacity="0.3" letter-spacing="14">
      thund3r
    </text>

    <!-- Main Clean Typography -->
    <text x="600" y="105" font-size="54" font-weight="900" fill="#f8fafc" letter-spacing="14">
      thund3r
    </text>

    <text x="600" y="145" font-size="12" font-weight="600" fill="rgba(255, 255, 255, 0.45)" letter-spacing="4">
      RUST • TAURI • TYPESCRIPT • DESKTOP &amp; WEB
    </text>
  </g>

  <!-- CRT Scanlines -->
  <rect width="1200" height="200" fill="url(#scanlines)" pointer-events="none" />
</svg>
