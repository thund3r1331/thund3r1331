<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Dark Void Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="50%" stop-color="#0c0d12" />
      <stop offset="100%" stop-color="#060608" />
    </linearGradient>

    <!-- Subtle Radial Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#ce422b" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Scanlines -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="1200" y2="0" stroke="#000000" stroke-width="2" opacity="0.35" />
      <line x1="0" y1="2" x2="1200" y2="2" stroke="#ffffff" stroke-width="0.5" opacity="0.02" />
    </pattern>

    <!-- Minimal Grid -->
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="0.75" />
      <circle cx="0" cy="0" r="0.75" fill="rgba(255,255,255,0.06)" />
    </pattern>
  </defs>

  <!-- Background Layers -->
  <rect width="1200" height="320" fill="url(#bg)" />
  <rect width="1200" height="320" fill="url(#grid)" />
  <rect width="1200" height="320" fill="url(#centerGlow)" />

  <!-- Minimal Gothic / Wing Accent Watermark -->
  <g transform="translate(600, 160) scale(1.8)" opacity="0.03" fill="#ffffff">
    <path d="M-10,-20 C-40,-70 -120,-80 -180,-40 C-140,-10 -90,20 -40,30 C-30,10 -20,0 -10,-20 Z" />
    <path d="M10,-20 C40,-70 120,-80 180,-40 C140,-10 90,20 40,30 C30,10 20,0 10,-20 Z" />
    <line x1="0" y1="-50" x2="0" y2="45" stroke="#ffffff" stroke-width="2.5" />
    <line x1="-25" y1="-20" x2="25" y2="-20" stroke="#ffffff" stroke-width="2.5" />
  </g>

  <!-- Minimal Framing Brackets & Metadata -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="10" fill="rgba(255, 255, 255, 0.25)" letter-spacing="1.5">
    <!-- Top Left -->
    <path d="M 35 45 L 35 30 L 50 30" stroke="rgba(255,255,255,0.15)" fill="none" stroke-width="1.2" />
    <text x="60" y="38">THUND3R.XYZ</text>

    <!-- Top Right -->
    <path d="M 1165 45 L 1165 30 L 1150 30" stroke="rgba(255,255,255,0.15)" fill="none" stroke-width="1.2" />
    <text x="1090" y="38">ARCHIVE</text>

    <!-- Bottom Left -->
    <path d="M 35 275 L 35 290 L 50 290" stroke="rgba(255,255,255,0.15)" fill="none" stroke-width="1.2" />
    <text x="60" y="286">DEV // SYSTEMS</text>

    <!-- Bottom Right -->
    <path d="M 1165 275 L 1165 290 L 1150 290" stroke="rgba(255,255,255,0.15)" fill="none" stroke-width="1.2" />
    <text x="1080" y="286">2026.08</text>
  </g>

  <!-- Clean Center Hero Typography -->
  <g text-anchor="middle">
    <!-- Chromatic Red Offset (Subtle glitch) -->
    <text x="601" y="166" font-family="'JetBrains Mono', 'Fira Code', -apple-system, monospace" font-size="56" font-weight="900" fill="#ce422b" opacity="0.2" letter-spacing="12">
      thund3r
    </text>

    <!-- Main Clean Typography -->
    <text x="600" y="165" font-family="'JetBrains Mono', 'Fira Code', -apple-system, monospace" font-size="56" font-weight="900" fill="#f8fafc" letter-spacing="12">
      thund3r
    </text>

    <!-- Sharp Monospaced Subtitle -->
    <text x="600" y="205" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="11" font-weight="500" fill="rgba(255, 255, 255, 0.4)" letter-spacing="4">
      RUST • TAURI • TYPESCRIPT • DESKTOP
    </text>
  </g>

  <!-- Scanlines Overlay -->
  <rect width="1200" height="320" fill="url(#scanlines)" pointer-events="none" />
</svg>
