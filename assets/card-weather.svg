<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBgW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14" />
      <stop offset="50%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <radialGradient id="glowCyan" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlinesW" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="800" y2="0" stroke="#000000" stroke-width="2" opacity="0.3" />
      <line x1="0" y1="2" x2="800" y2="2" stroke="#ffffff" stroke-width="0.5" opacity="0.015" />
    </pattern>

    <!-- Micro Grid -->
    <pattern id="gridW" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.018)" stroke-width="0.7" />
    </pattern>
  </defs>

  <!-- Card Frame -->
  <rect width="800" height="160" rx="12" fill="url(#cardBgW)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.2" />
  <rect width="800" height="160" rx="12" fill="url(#gridW)" />
  <rect width="800" height="160" rx="12" fill="url(#glowCyan)" />

  <!-- Left Accent Stripe -->
  <path d="M 0 12 Q 0 0 12 0 L 12 0 L 12 160 L 12 160 Q 0 160 0 148 Z" fill="#38bdf8" />

  <!-- Background Watermark Symbol -->
  <g transform="translate(720, 95) rotate(10)" opacity="0.035" fill="#38bdf8">
    <path d="M0,0 C20,-30 60,-40 100,-30 C80,-10 70,10 60,30 C45,15 30,5 0,0 Z" transform="scale(1.5)" />
  </g>

  <!-- Card Content -->
  <g transform="translate(36, 0)">
    <!-- Header: Title + Tag -->
    <g transform="translate(0, 42)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
        ⛅ weather-cli
      </text>

      <!-- CLI Badge -->
      <g transform="translate(165, -16)">
        <rect width="45" height="20" rx="4" fill="rgba(56, 189, 248, 0.15)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1" />
        <text x="22.5" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#7dd3fc" text-anchor="middle">CLI</text>
      </g>
    </g>

    <!-- Description -->
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="rgba(255, 255, 255, 0.7)">
      Lightweight terminal weather client with real-time WMO decoding, ASCII art &amp; ANSI styling.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 110)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">
      <!-- Node.js Badge -->
      <rect x="0" y="0" width="76" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" />
      <text x="12" y="16" fill="#68a063">Node.js</text>

      <!-- Open-Meteo Badge -->
      <rect x="84" y="0" width="94" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" />
      <text x="95" y="16" fill="#38bdf8">Open-Meteo</text>

      <!-- Terminal Badge -->
      <rect x="186" y="0" width="76" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" />
      <text x="198" y="16" fill="#facc15">Terminal</text>
    </g>
  </g>

  <!-- Scanlines Overlay -->
  <rect width="800" height="160" rx="12" fill="url(#scanlinesW)" pointer-events="none" />
</svg>
