<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14" />
      <stop offset="50%" stop-color="#08090d" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Red Accent Glow -->
    <radialGradient id="glowRed" cx="0%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ce422b" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="800" y2="0" stroke="#000000" stroke-width="2" opacity="0.3" />
      <line x1="0" y1="2" x2="800" y2="2" stroke="#ffffff" stroke-width="0.5" opacity="0.015" />
    </pattern>

    <!-- Micro Grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.018)" stroke-width="0.7" />
    </pattern>
  </defs>

  <!-- Card Frame -->
  <rect width="800" height="160" rx="12" fill="url(#cardBg)" stroke="rgba(255, 255, 255, 0.09)" stroke-width="1.2" />
  <rect width="800" height="160" rx="12" fill="url(#grid)" />
  <rect width="800" height="160" rx="12" fill="url(#glowRed)" />

  <!-- Left Accent Accent Stripe -->
  <path d="M 0 12 Q 0 0 12 0 L 12 0 L 12 160 L 12 160 Q 0 160 0 148 Z" fill="#ce422b" />

  <!-- Background Watermark Symbol -->
  <g transform="translate(730, 95) rotate(-15)" opacity="0.04" fill="#ce422b">
    <circle cx="0" cy="0" r="70" />
    <path d="M-30,-30 L30,30 L10,50 L-50,-10 Z" />
  </g>

  <!-- Card Content -->
  <g transform="translate(36, 0)">
    <!-- Header: Title + Tag -->
    <g transform="translate(0, 42)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#ffffff" letter-spacing="-0.3">
        🎨 ChromaDrop
      </text>

      <!-- Version Badge -->
      <g transform="translate(165, -16)">
        <rect width="54" height="20" rx="4" fill="rgba(206, 66, 43, 0.15)" stroke="rgba(206, 66, 43, 0.45)" stroke-width="1" />
        <text x="27" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#ff7a5c" text-anchor="middle">v1.2.0</text>
      </g>
    </g>

    <!-- Description -->
    <text x="0" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" fill="rgba(255, 255, 255, 0.7)">
      Desktop screen eyedropper, OKLCH color engine, WCAG 2.1 inspector &amp; gradient studio.
    </text>

    <!-- Tech Badges -->
    <g transform="translate(0, 110)" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="10.5">
      <!-- Tauri Badge -->
      <rect x="0" y="0" width="76" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" />
      <text x="11" y="16" fill="#94a3b8">Tauri v2</text>

      <!-- Rust Badge -->
      <rect x="84" y="0" width="56" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" />
      <text x="96" y="16" fill="#dea584">Rust</text>

      <!-- Vue Badge -->
      <rect x="148" y="0" width="60" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" />
      <text x="159" y="16" fill="#4fc08d">Vue 3</text>

      <!-- Tailwind Badge -->
      <rect x="216" y="0" width="75" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.09)" />
      <text x="227" y="16" fill="#38b2ac">Tailwind</text>
    </g>
  </g>

  <!-- Scanlines Overlay -->
  <rect width="800" height="160" rx="12" fill="url(#scanlines)" pointer-events="none" />
</svg>
