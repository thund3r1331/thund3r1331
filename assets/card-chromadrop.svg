<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 170" width="100%" height="100%">
  <defs>
    <!-- Dark Void Gradient -->
    <linearGradient id="gothBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050507" />
      <stop offset="50%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- Crimson Void Glow -->
    <radialGradient id="gothGlow1" cx="20%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ce422b" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Scanline Pattern -->
    <pattern id="scanlinesG1" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="800" y2="0" stroke="#000000" stroke-width="2" opacity="0.35" />
      <line x1="0" y1="2" x2="800" y2="2" stroke="#ffffff" stroke-width="0.5" opacity="0.02" />
    </pattern>

    <!-- Wire Grid -->
    <pattern id="gridG1" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255, 255, 255, 0.02)" stroke-width="0.75" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="170" fill="url(#gothBg1)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />
  <rect width="800" height="170" fill="url(#gridG1)" />
  <rect width="800" height="170" fill="url(#gothGlow1)" />

  <!-- Gothic Wing & Cross Watermark Background -->
  <g transform="translate(710, 85) scale(1.4)" opacity="0.04" fill="#ffffff">
    <path d="M-10,-20 C-40,-70 -120,-80 -180,-40 C-140,-10 -90,20 -40,30 C-30,10 -20,0 -10,-20 Z" />
    <path d="M10,-20 C40,-70 120,-80 180,-40 C140,-10 90,20 40,30 C30,10 20,0 10,-20 Z" />
    <circle cx="0" cy="-55" r="10" fill="none" stroke="#ffffff" stroke-width="2" />
    <line x1="0" y1="-45" x2="0" y2="40" stroke="#ffffff" stroke-width="2" />
    <line x1="-20" y1="-15" x2="20" y2="-15" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Sharp Gothic Framing Corners -->
  <g stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.2" fill="none" font-family="'JetBrains Mono', monospace" font-size="8.5" letter-spacing="1.5">
    <!-- Top-Left -->
    <path d="M 18 28 L 18 16 L 30 16" />
    <text x="36" y="22" fill="rgba(255,255,255,0.3)" stroke="none">RELIC.01</text>

    <!-- Top-Right -->
    <path d="M 782 28 L 782 16 L 770 16" />
    <text x="690" y="22" fill="rgba(206,66,43,0.7)" stroke="none">[ v1.2.0 ]</text>

    <!-- Bottom-Left -->
    <path d="M 18 142 L 18 154 L 30 154" />
    <text x="36" y="152" fill="rgba(255,255,255,0.25)" stroke="none">0xCE422B</text>

    <!-- Bottom-Right -->
    <path d="M 782 142 L 782 154 L 770 154" />
    <text x="705" y="152" fill="rgba(255,255,255,0.25)" stroke="none">ARCHIVE</text>
  </g>

  <!-- Card Content -->
  <g transform="translate(36, 0)">
    <!-- Title with Gothic Cross and Red Chromatic Glitch -->
    <g transform="translate(0, 56)">
      <!-- Glitch Red Offset -->
      <text font-family="'JetBrains Mono', 'Cinzel', serif, monospace" font-size="20" font-weight="900" fill="#ce422b" opacity="0.35" letter-spacing="4">
        † CHROMADROP
      </text>
      <!-- Main Title -->
      <text x="-1" y="-1" font-family="'JetBrains Mono', 'Cinzel', serif, monospace" font-size="20" font-weight="900" fill="#f8fafc" letter-spacing="4">
        † CHROMADROP
      </text>
    </g>

    <!-- Gothic Subtitle -->
    <text x="0" y="82" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="rgba(255, 255, 255, 0.4)" letter-spacing="2">
      [ DESKTOP EYEDROPPER // OKLCH ENGINE // WCAG SUITE ]
    </text>

    <!-- Description -->
    <text x="0" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.65)">
      Ultra-fast screen pixel inspector, OKLCH converter &amp; live gradient studio.
    </text>

    <!-- Monospaced Boxed Tech Tags -->
    <g transform="translate(0, 124)" font-family="'JetBrains Mono', monospace" font-size="9.5" letter-spacing="1">
      <rect x="0" y="0" width="82" height="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="10" y="14" fill="#cbd5e1">TAURI.V2</text>

      <rect x="90" y="0" width="58" height="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="100" y="14" fill="#dea584">RUST</text>

      <rect x="156" y="0" width="62" height="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="166" y="14" fill="#4fc08d">VUE.3</text>

      <rect x="226" y="0" width="86" height="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
      <text x="236" y="14" fill="#38b2ac">TAILWIND</text>
    </g>
  </g>

  <!-- Scanlines Overlay -->
  <rect width="800" height="170" fill="url(#scanlinesG1)" pointer-events="none" />
</svg>
